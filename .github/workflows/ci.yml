name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # One exact version, the one in .nvmrc. Where a Japanese line folds
          # is decided at build time with ICU's dictionary, which ships with
          # Node, so the build must not drift with whatever 22 is newest.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Must stay at 0 errors.
      - run: npm run check

      # Builds, then runs the suite against dist/.
      - run: npm test
