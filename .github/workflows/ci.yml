name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches "engines" in package.json.
          node-version: 22
          cache: npm

      - run: npm ci

      # Must stay at 0 errors.
      - run: npm run check

      # Builds, then runs the suite against dist/.
      - run: npm test
